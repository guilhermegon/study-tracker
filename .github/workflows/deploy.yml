name: Deploy

# Versionamento automático:
# - commit direto na main (sem PR)            -> bump de PATCH  (2.0.0 -> 2.0.1)
# - PR mergeado de branch comum (sem "release")-> bump de MINOR  (2.0.0 -> 2.1.0)
# - PR mergeado de branch "release*"           -> bump de MAJOR  (2.0.0 -> 3.0.0)
#
# IMPORTANTE: a detecção de "commit direto" (vs. PR mergeado) depende do
# commit de merge padrão do GitHub ("Merge pull request #N from ..."), que
# só existe quando o PR é mergeado com a estratégia "Create a merge commit".
# Se o repositório usar squash/rebase merge, configure para permitir só
# merge commit em Settings > General > Pull Requests, senão um PR mergeado
# pode disparar bump duplicado (o da PR + um de patch indevido).
#
# A imagem é buildada aqui (runner do GitHub, bem mais forte) e publicada
# no GitHub Container Registry — a VM (1 vCPU / 1GB RAM) só dá "pull" e
# sobe o container, nunca builda nada localmente.

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Determinar tipo de bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BRANCH="${{ github.event.pull_request.head.ref }}"
            if [[ "$BRANCH" == release* ]]; then
              echo "type=major" >> "$GITHUB_OUTPUT"
            else
              echo "type=minor" >> "$GITHUB_OUTPUT"
            fi
          else
            MSG=$(git log -1 --pretty=%s)
            if [[ "$MSG" =~ ^Merge\ pull\ request\ #[0-9]+\ from ]]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "type=patch" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Calcular nova versão
        if: steps.bump.outputs.skip != 'true'
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ steps.bump.outputs.type }}" in
            major) NEW="$((MAJOR+1)).0.0" ;;
            minor) NEW="$MAJOR.$((MINOR+1)).0" ;;
            patch) NEW="$MAJOR.$MINOR.$((PATCH+1))" ;;
          esac
          echo "new=$NEW" >> "$GITHUB_OUTPUT"

      - name: Atualizar package.json, commitar e criar tag
        if: steps.bump.outputs.skip != 'true'
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ steps.version.outputs.new }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new }}"
          git tag "v${{ steps.version.outputs.new }}"
          git push origin main
          git push origin "v${{ steps.version.outputs.new }}"

      - name: Configurar Buildx
        if: steps.bump.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: steps.bump.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        if: steps.bump.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.new }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH (só pull + up, sem build)
        if: steps.bump.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 10m
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd ~/study-tracker
            git pull
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d
