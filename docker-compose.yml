services:
  app:
    image: ghcr.io/guilhermegon/study-tracker:latest
    build: .
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - BACKUP_EMAIL_FROM=${BACKUP_EMAIL_FROM:-onboarding@resend.dev}
      - BACKUP_EMAIL_TO=${BACKUP_EMAIL_TO:-paulaayres@hotmail.com}
      - BACKUP_EMAIL_HOUR=${BACKUP_EMAIL_HOUR:-23}
    volumes:
      - ./server/data:/app/server/data
    expose:
      - "3001"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
